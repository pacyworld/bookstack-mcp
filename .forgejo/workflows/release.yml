name: Release
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: FreeBSD
    steps:
      - name: Checkout
        run: git clone --branch ${{ github.ref_name }} --depth=1 ${{ github.server_url }}/${{ github.repository }}.git .

      - name: Stamp version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "" "s|define('APPLICATION_VERSION', '.*')|define('APPLICATION_VERSION', '${VERSION}')|" system/app.conf.php
          grep APPLICATION_VERSION system/app.conf.php
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Build PHAR
        run: php -d phar.readonly=0 bin/build-phar.php

      - name: Verify PHAR
        run: |
          php -r "
          \$phar = new Phar('bookstack-mcp.phar');
          echo 'Files: ' . \$phar->count() . PHP_EOL;
          assert(\$phar->count() > 20, 'PHAR should contain 20+ files');
          echo 'PHAR verified' . PHP_EOL;
          "

      - name: Create release and upload PHAR
        run: |
          TAG="${GITHUB_REF_NAME}"
          BODY="BookStack MCP Server ${TAG} — 58 tools, multi-instance, PHAR binary included."
          echo "Creating release ${TAG}..."
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${FORGE_TOKEN}" \
            -H "Content-Type: application/json" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"${BODY}\"}")
          echo "Response: ${RESPONSE}"
          RELEASE_ID=$(echo "${RESPONSE}" | php -r '$d=json_decode(file_get_contents("php://stdin"),true); if(!isset($d["id"])){fwrite(STDERR,"ERROR: ".json_encode($d)."\n");exit(1);}echo $d["id"];')
          echo "Release ID: ${RELEASE_ID}"
          echo "Uploading PHAR..."
          curl -s -X POST \
            -H "Authorization: token ${FORGE_TOKEN}" \
            -F "attachment=@bookstack-mcp.phar" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=bookstack-mcp.phar"
          echo "Done."
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
